{% extends "base.html" %}

{% block title %}Sign In — PocketSmart AI{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card">
        <div class="card-header" style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem; width: 44px; height: 44px; font-size: 1.3rem;">⚡</div>
            <h2 class="card-title" style="font-size: 1.8rem;">Welcome Back</h2>
            <p class="card-subtitle">Sign in to access your budget planners and saved history</p>
        </div>

        <div id="auth-error" class="alert alert-error" style="display: none;"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email" class="form-label">Email Address <span class="required">*</span></label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
                    <label for="password" class="form-label" style="margin: 0;">Password <span class="required">*</span></label>
                </div>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <button type="submit" class="btn btn-primary btn-block">Sign In →</button>
            </div>

            <!-- Demo Quick Filler Helper -->
            <div style="margin-bottom: 1.5rem; text-align: center;">
                <button type="button" id="demo-fill-btn" class="btn btn-outline btn-sm btn-block" style="border-style: dashed;">
                    ⚡ Auto-Fill Demo Credentials
                </button>
            </div>
        </form>

        <div style="text-align: center; border-top: 1px solid var(--border-subtle); padding-top: 1.25rem;">
            <p style="color: var(--text-muted); font-size: 0.9rem;">
                Don't have an account? <a href="/register" style="font-weight: 600;">Create one now</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
