{% extends "base.html" %}

{% block title %}Create an Account — PocketSmart AI{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 3rem auto;">
    <div class="card">
        <div class="card-header" style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem; width: 44px; height: 44px; font-size: 1.3rem;">⚡</div>
            <h2 class="card-title" style="font-size: 1.8rem;">Create Account</h2>
            <p class="card-subtitle">Get instant access to AI-powered budget planning</p>
        </div>

        <div id="auth-error" class="alert alert-error" style="display: none;"></div>

        <form id="register-form">
            <div class="form-group">
                <label for="name" class="form-label">Full Name <span class="required">*</span></label>
                <input type="text" id="name" class="form-control" placeholder="Alex Morgan" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address <span class="required">*</span></label>
                <input type="email" id="email" class="form-control" placeholder="alex@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password <span class="required">*</span></label>
                <input type="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password <span class="required">*</span></label>
                <input type="password" id="confirm_password" class="form-control" placeholder="Repeat your password" minlength="6" required autocomplete="new-password">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <button type="submit" class="btn btn-primary btn-block">Sign Up & Start Planning →</button>
            </div>
        </form>

        <div style="text-align: center; border-top: 1px solid var(--border-subtle); padding-top: 1.25rem;">
            <p style="color: var(--text-muted); font-size: 0.9rem;">
                Already have an account? <a href="/login" style="font-weight: 600;">Sign in here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
